apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: pipeline-demo

  template:
    metadata:
      labels:
        app: pipeline-demo

    spec:
      containers:
        - name: pipeline-demo
          image: akhilesoni/pipeline-demo:22
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"